name: Version Bump

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'examples/**'
      - '.github/workflows/version-bump.yml'
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  version-bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bump2version
    
    - name: Configure Git
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
    
    - name: Get current version
      id: current_version
      run: |
        CURRENT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
        echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
        echo "Current version: $CURRENT_VERSION"
    
    - name: Determine version bump type
      id: version_type
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION_TYPE="${{ github.event.inputs.version_type }}"
        else
          # Check commit messages for version bump indicators
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MSG"
          if echo "$COMMIT_MSG" | grep -qi "major\|breaking"; then
            VERSION_TYPE="major"
          elif echo "$COMMIT_MSG" | grep -qi "minor\|feature"; then
            VERSION_TYPE="minor"
          else
            VERSION_TYPE="patch"
          fi
        fi
        echo "version_type=$VERSION_TYPE" >> $GITHUB_OUTPUT
        echo "Version bump type: $VERSION_TYPE"
    
    - name: Bump version
      id: bump_version
      run: |
        # Create bump2version config
        cat > .bumpversion.cfg << EOF
        [bumpversion]
        current_version = ${{ steps.current_version.outputs.current_version }}
        commit = True
        tag = True
        tag_name = v{new_version}
        message = Bump version: {current_version} → {new_version}
        
        [bumpversion:file:pyproject.toml]
        search = version = "{current_version}"
        replace = version = "{new_version}"
        
        [bumpversion:file:united_system/__init__.py]
        search = __version__ = '{current_version}'
        replace = __version__ = '{new_version}'
        EOF
        
        # Add the config file to git first
        git add .bumpversion.cfg
        
        # Perform the version bump
        bump2version ${{ steps.version_type.outputs.version_type }} --verbose
        
        # Get the new version
        NEW_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "New version: $NEW_VERSION"
    
    - name: Push changes
      run: |
        git push origin HEAD:main
        git push origin v${{ steps.bump_version.outputs.new_version }}
    
    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.bump_version.outputs.new_version }}
        release_name: Release v${{ steps.bump_version.outputs.new_version }}
        body: |
          ## Changes in v${{ steps.bump_version.outputs.new_version }}
          
          This release includes:
          - Bug fixes and improvements
          - See commit history for detailed changes
          
          **Full Changelog**: https://github.com/${{ github.repository }}/compare/v${{ steps.current_version.outputs.current_version }}...v${{ steps.bump_version.outputs.new_version }}
        draft: false
        prerelease: false